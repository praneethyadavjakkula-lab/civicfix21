<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicFix - Register</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #e8f1f8,
                #ffffff
            );

            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;

            color: #12355b;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;

            color: #12355b;

            font-weight: bold;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d5dce3;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #12355b;

            box-shadow:
                0 0 0 2px
                rgba(18, 53, 91, 0.1);
        }

        .register-button {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 7px;

            background-color: #12355b;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .register-button:hover {
            background-color: #1e568c;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .login-link a {
            color: #12355b;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            color: #f4a261;
        }

        .error {
            background-color: #ffe5e5;

            color: #c0392b;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;

            font-size: 14px;
        }

        .success {
            background-color: #e5f8ec;

            color: #218838;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;

            font-size: 14px;
        }

        @media (max-width: 500px) {

            .register-container {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>

    <div class="register-container">

        <div class="logo">
            CivicFix
        </div>

        <p class="subtitle">
            Create your CivicFix account
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        {% if success %}

        <div class="success">
            {{ success }}
        </div>

        {% endif %}


        <form method="POST" action="/register">


            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</body>

</html>
