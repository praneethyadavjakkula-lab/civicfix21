<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CivicFix - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #e8f1f8,
                #ffffff
            );

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px 35px;

            border-radius: 15px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;

            color: #12355b;

            font-size: 32px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            color: #12355b;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d5dce3;

            border-radius: 7px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #12355b;

            box-shadow:
                0 0 0 2px
                rgba(18, 53, 91, 0.1);
        }

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background-color: #12355b;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-button:hover {
            background-color: #1e568c;
        }

        .register-link {
            text-align: center;

            margin-top: 22px;

            color: #666;
        }

        .register-link a {
            color: #12355b;

            font-weight: bold;

            text-decoration: none;
        }

        .register-link a:hover {
            color: #f4a261;
        }

        .error {
            background-color: #ffe5e5;

            color: #c0392b;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="logo">
            CivicFix
        </div>

        <p class="subtitle">
            Login to your account
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="/login">


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button">

                Login

            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </div>

    </div>

</body>

</html>
